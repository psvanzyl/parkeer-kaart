<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parkeerkaart Den Haag — Wego</title>
<meta name="description" content="Interactieve kaart van alle parkeerplaatsen en -garages in Den Haag. Filter op soort, betaling, toegankelijkheid en capaciteit.">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
  --green:#16a34a; --green-d:#15803d; --chip:#e8f5ee;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{display:flex;height:100%}
#side{width:340px;min-width:300px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:2}
#hdr{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#hdr h1{margin:0;font-size:19px;letter-spacing:-.02em}
#hdr h1 .p{color:var(--green)}
#hdr .sub{margin-top:2px;font-size:12.5px;color:var(--muted)}
#stats{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--muted)}
#searchwrap{padding:10px 16px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
#q:focus{border-color:var(--green)}
#facets{flex:1;overflow-y:auto;padding:6px 16px 12px}
.facet{margin-top:12px}
.facet h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;cursor:pointer;user-select:none;position:relative}
.frow:hover{background:var(--bg)}
.frow .bar{position:absolute;left:0;top:2px;bottom:2px;background:var(--chip);border-radius:8px;z-index:0}
.frow.on .bar{background:#cdeed8}
.frow .lbl,.frow .cnt{position:relative;z-index:1}
.frow .lbl{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.frow.on .lbl{font-weight:600}
.frow.dim{opacity:.45}
#clr{margin:10px 16px 14px 16px;padding:7px 12px;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;display:none}
#clr.show{display:block}
#res{max-height:26%;overflow-y:auto;border-top:1px solid var(--line)}
.rrow{padding:8px 16px;border-bottom:1px solid var(--bg);cursor:pointer;font-size:13px}
.rrow:hover{background:var(--bg)}
.rrow small{display:block;color:var(--muted);font-size:11.5px}
#map{flex:1}
.legend{position:absolute;bottom:22px;left:12px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;z-index:1;backdrop-filter:blur(4px)}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
.dot{width:10px;height:10px;border-radius:50%}
.popup{font-size:13px;line-height:1.45;min-width:180px;max-width:250px}
.popup b{font-size:14px}
.popup .tag{display:inline-block;background:var(--chip);color:var(--green-d);border-radius:99px;padding:1px 8px;font-size:11px;margin:3px 4px 3px 0}
.popup table{margin-top:4px;border-collapse:collapse}
.popup td{padding:1px 6px 1px 0;color:var(--muted);vertical-align:top;font-size:12px}
.popup td:last-child{color:var(--ink)}
#toggle{display:none;position:absolute;top:10px;left:10px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
@media(max-width:820px){
  #side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.18)}
  #side.open{transform:none}
  #toggle{display:block}
}
.maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="hdr">
      <h1><span class="p">Parkeren</span> Den Haag</h1>
      <div class="sub">Alle parkeerlocaties uit OpenStreetMap · <a href="https://wego.laserraptor.eu" style="color:var(--green-d)">Wego</a></div>
    </div>
    <div id="stats">
      <div class="stat"><b id="st-loc">–</b><span>locaties getoond</span></div>
      <div class="stat"><b id="st-cap">–</b><span>plaatsen (OSM)</span></div>
    </div>
    <div id="searchwrap"><input id="q" type="search" placeholder="Zoek een parkeergarage of straat…" autocomplete="off"></div>
    <div id="facets"></div>
    <button id="clr">Wis alle filters</button>
    <div id="res"></div>
  </aside>
  <main id="map" style="position:relative">
    <button id="toggle">☰ Filters</button>
    <div class="legend" id="legend"></div>
  </main>
</div>
<script src="data.js"></script>
<script>
(function(){
"use strict";
var FD = window.PARKING_DATA.features;
var COLORS = {underground:"#6366f1","multi-storey":"#0ea5e9",surface:"#16a34a",rooftop:"#f59e0b",street:"#a855f7","?":"#94a3b8"};
var SOORT = {underground:"Ondergronds","multi-storey":"Parkeergarage",surface:"Parkeerterrein",rooftop:"Dakparkeergarage",street:"Straatparkeren","?":"Overig"};
var ACC = {"yes":"Publiek toegankelijk",customers:"Alleen klanten",private:"Privé","?":"Onbekend"};
var CAPB = {b1:"< 100 plekken",b2:"100 – 499",b3:"500 – 1499",b4:"1500+",none:"Onbekend"};

function soortOf(f){
  var p=f.properties;
  if(p.parking==="lane_parking"||p.parking==="layby") return "street";
  if(p.parking && SOORT[p.parking]) return p.parking;
  return "?";
}
function accOf(f){
  var a=f.properties.access;
  if(a==="permissive") return "yes";
  if(a==="customers"||a==="private") return a;
  return "?";
}
function capBucket(f){
  var c=+f.properties.capacity;
  if(!c) return "none";
  if(c<100) return "b1"; if(c<500) return "b2"; if(c<1500) return "b3"; return "b4";
}
FD.forEach(function(f,i){
  f.__i=i; f.__soort=soortOf(f); f.__acc=accOf(f); f.__cap=capBucket(f);
  f.__pr=f.properties.park_ride==="yes";
  f.__fee=f.properties.fee==="yes"?"yes":f.properties.fee==="no"?"no":"?";
});
var FACETS=[
  {id:"soort",label:"Soort",key:"__soort",vals:["underground","multi-storey","surface","rooftop","street","?"],names:SOORT},
  {id:"fee",label:"Betaling",key:"__fee",vals:["yes","no","?"],names:{"yes":"Betaald","no":"Gratis","?":"Onbekend"}},
  {id:"acc",label:"Toegang",key:"__acc",vals:["yes","customers","private","?"],names:ACC},
  {id:"pr",label:"P+R",key:"__pr",vals:[true,false],names:{true:"P+R routes",false:"Geen P+R"}},
  {id:"cap",label:"Capaciteit",key:"__cap",vals:["b1","b2","b3","b4","none"],names:CAPB}
];
var state={q:""}; FACETS.forEach(function(fc){state[fc.id]=new Set();});

function matchExcept(f,skip){
  if(state.q && (f.properties.name||"").toLowerCase().indexOf(state.q)<0) return false;
  for(var i=0;i<FACETS.length;i++){ var fc=FACETS[i];
    if(fc.id===skip||state[fc.id].size===0) continue;
    if(!state[fc.id].has(f[fc.key])) return false; }
  return true;
}
function matchAll(f){ return matchExcept(f,null); }

// ---------- map ----------
var map=new maplibregl.Map({
  container:"map",
  style:"https://tiles.openfreemap.org/styles/bright",
  center:[4.300,52.074], zoom:12.1, attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}));
var popup=new maplibregl.Popup({maxWidth:"260px"});

// group polygon features per soort so each group can carry one colour
var polyBySoort={};
FD.forEach(function(f){ if(f.rings) (polyBySoort[f.__soort]=polyBySoort[f.__soort]||[]).push(f.__i); });
function polysFor(soort,keepIds){
  var arr=[];
  polyBySoort[soort].forEach(function(i){ var f=FD[i];
    if(keepIds && !keepIds[i]) return;
    f.rings.forEach(function(r){ arr.push({type:"Feature",properties:{i:i},geometry:{type:"Polygon",coordinates:[r]}}); });
  });
  return {type:"FeatureCollection",features:arr};
}
function pointsFor(keep){
  return {type:"FeatureCollection",features:keep.map(function(f){
    return {type:"Feature",properties:{i:f.__i,soort:f.__soort},geometry:f.geometry};})};
}
map.on("load",function(){
  Object.keys(polyBySoort).forEach(function(s){
    map.addSource("polys-"+s,{type:"geojson",data:polysFor(s)});
    map.addLayer({id:"fill-"+s,type:"fill",source:"polys-"+s,paint:{"fill-color":COLORS[s]||COLORS["?"],"fill-opacity":0.22}});
    map.addLayer({id:"line-"+s,type:"line",source:"polys-"+s,paint:{"line-color":COLORS[s]||COLORS["?"],"line-width":1,"line-opacity":0.7}});
  });
  map.addSource("pts",{type:"geojson",data:pointsFor(FD)});
  map.addLayer({id:"pts",type:"circle",source:"pts",paint:{
    "circle-radius":["interpolate",["linear"],["zoom"],11,3.5,14,6,17,9],
    "circle-color":["match",["get","soort"],
      "underground",COLORS.underground,"multi-storey",COLORS["multi-storey"],
      "surface",COLORS.surface,"rooftop",COLORS.rooftop,"street",COLORS.street,COLORS["?"]],
    "circle-stroke-color":"#fff","circle-stroke-width":1.2,"circle-opacity":0.92}});
  wireClicks();
  refresh();
});
function refresh(){
  if(!map.getSource("pts")) return;
  var keep=FD.filter(matchAll);
  var ids={}; keep.forEach(function(f){ids[f.__i]=true;});
  Object.keys(polyBySoort).forEach(function(s){ map.getSource("polys-"+s).setData(polysFor(s,ids)); });
  map.getSource("pts").setData(pointsFor(keep));
  var cap=0; keep.forEach(function(f){ cap+=+f.properties.capacity||0; });
  document.getElementById("st-loc").textContent=fmt(keep.length);
  document.getElementById("st-cap").textContent=fmt(cap);
  document.getElementById("clr").className=(state.q||FACETS.some(function(fc){return state[fc.id].size;}))?"show":"";
  renderFacets(); renderRes();
}
function wireClicks(){
  var hit=[]; Object.keys(polyBySoort).forEach(function(s){hit.push("fill-"+s);}); hit.push("pts");
  hit.forEach(function(id){ map.on("click",id,function(e){
    var i=+e.features[0].properties.i, f=FD[i];
    showPopup(f, f.geometry.coordinates);
  });});
  map.on("mouseenter","pts",function(){map.getCanvas().style.cursor="pointer";});
  map.on("mouseleave","pts",function(){map.getCanvas().style.cursor="";});
}
function fmt(v){return v==null?"–":Number(v).toLocaleString("nl-NL");}
function showPopup(f,coords){
  var p=f.properties, rows="";
  function row(l,v){ if(v) rows+="<tr><td>"+l+"</td><td>"+v+"</td></tr>"; }
  row("Soort",SOORT[f.__soort]);
  row("Capaciteit",p.capacity?fmt(p.capacity)+" plekken":"");
  if(f.__fee!=="?") row("Betaling",f.__fee==="yes"?"Betaald":"Gratis");
  if(f.__acc!=="?") row("Toegang",ACC[f.__acc]);
  row("Operator",p.operator);
  row("Openingstijden",p.opening_hours);
  row("Max verblijf",p.maxstay);
  var h="<b>"+(p.name||SOORT[f.__soort])+"</b>";
  if(f.__pr) h+="<span class='tag'>P+R</span>";
  if(p.capacity) h+="<span class='tag'>"+fmt(p.capacity)+" plekken</span>";
  popup.setLngLat(coords).setHTML(h+"<table>"+rows+"</table>").addTo(map);
}

// ---------- facets UI ----------
var facetsEl=document.getElementById("facets");
function renderFacets(){
  facetsEl.innerHTML="";
  FACETS.forEach(function(fc){
    var counts={}, max=0;
    FD.forEach(function(f){ if(!matchExcept(f,fc.id)) return;
      var v=f[fc.key]; counts[v]=(counts[v]||0)+1; if(counts[v]>max)max=counts[v]; });
    var box=document.createElement("div"); box.className="facet";
    box.innerHTML="<h3>"+fc.label+"</h3>";
    fc.vals.forEach(function(v){
      var c=counts[v]||0, on=state[fc.id].has(v);
      if(!c && !on) return;
      var row=document.createElement("div"); row.className="frow"+(on?" on":"")+(c?"":" dim");
      row.innerHTML="<span class='bar' style='width:"+Math.round(100*c/Math.max(max,1))+"%'></span>"+
        "<span class='lbl'>"+fc.names[v]+"</span><span class='cnt'>"+fmt(c)+"</span>";
      row.onclick=function(){ on?state[fc.id].delete(v):state[fc.id].add(v); refresh(); };
      box.appendChild(row);
    });
    facetsEl.appendChild(box);
  });
}
var resEl=document.getElementById("res");
function renderRes(){
  resEl.innerHTML="";
  if(!state.q) return;
  FD.filter(function(f){return f.properties.name&&matchAll(f);}).slice(0,25).forEach(function(f){
    var d=document.createElement("div"); d.className="rrow";
    d.innerHTML=f.properties.name+"<small>"+SOORT[f.__soort]+(f.properties.capacity?" · "+fmt(f.properties.capacity)+" plekken":"")+"</small>";
    d.onclick=function(){ map.flyTo({center:f.geometry.coordinates,zoom:16});
      showPopup(f,f.geometry.coordinates);
      if(innerWidth<=820) document.getElementById("side").classList.remove("open"); };
    resEl.appendChild(d);
  });
}
document.getElementById("q").addEventListener("input",function(e){ state.q=e.target.value.trim().toLowerCase(); refresh(); });
document.getElementById("clr").onclick=function(){ state.q=""; document.getElementById("q").value="";
  FACETS.forEach(function(fc){state[fc.id]=new Set();}); refresh(); };
document.getElementById("toggle").onclick=function(){ document.getElementById("side").classList.toggle("open"); };
// legend
var leg=document.getElementById("legend");
["underground","multi-storey","surface","rooftop"].forEach(function(s){
  leg.insertAdjacentHTML("beforeend","<div><span class='dot' style='background:"+COLORS[s]+"'></span>"+SOORT[s]+"</div>");
});
leg.insertAdjacentHTML("beforeend","<div style='margin-top:5px;color:#64748b;font-size:10.5px'>© OpenStreetMap · OpenFreeMap</div>");
refresh();
})();
</script>
</body>
</html>
